name: 发布到 PyPI

# 发布了非预发行的新版本时
on:
  release:
    types: [released]

permissions: {}

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 签出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: 构建
        shell: bash
        run: uv build --no-sources

      - name: 功能测试 (wheel)
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl --with "pytest" --with "pytest-cov" pytest -vv

      - name: 功能测试 (源码分发)
        shell: bash
        run: uv run --isolated --no-project --with dist/*.tar.gz --with "pytest" --with "pytest-cov" pytest -vv

      - name: 上传分发文件为工件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: 发布
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
    steps:
      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: 下载分发工件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: 生成 PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: 发布
        shell: bash
        run: uv publish --publish-url "https://upload.pypi.org/legacy/" --check-url "https://pypi.org/simple"
